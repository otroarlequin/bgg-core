# Fly app for ephemeral BGG Profile (visitors). Separate from bgg-core personal.
# Deploy: fly deploy -c fly.profile.toml -a bgg-profile
# Secrets: BGG_TOKEN (required). Do NOT mount the personal volume.

app = 'bgg-profile'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile.profile'

[env]
  HOST = '0.0.0.0'
  PORT = '3001'
  APP_MODE = 'profile'
  # Durable across machine stop/start (not /tmp).
  PROFILE_SESSIONS_DIR = '/data/sessions'
  WEB_ROOT = '/app/web/dist'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # Long syncs (collection+plays+things) can peg CPU; avoid early kill.
    grace_period = '5m'
    method = 'GET'
    path = '/api/health'

[[mounts]]
  source = 'bgg_profile_sessions'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
